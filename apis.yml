    description: >-
      Cantor Prime Services is the firm's multi-asset prime-brokerage platform launched
      in 2009, offering custody, securities lending, financing, and capital introduction
      to hedge funds and asset managers. Connectivity is delivered via institutional
      FIX sessions and bilateral integrations rather than a public REST API.
