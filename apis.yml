description: >-
  Cantor Fitzgerald, L.P. is a privately held global financial services firm founded
  in 1945 by Bernard Gerald Cantor and John Fitzgerald, headquartered in New York
  with more than 12,000 employees across 60+ offices in 20+ countries. The firm is
  a U.S. Federal Reserve primary dealer and operates investment banking, fixed-income
  and equities trading, prime brokerage, commercial real-estate lending (CCRE / Cantor
  Fitzgerald Income Trust), asset management, a SPAC franchise (Cantor Equity Partners),
  and corporate-venture investing (Cantor Ventures, Hollywood Stock Exchange). Cantor
  spun out its voice-brokerage business in 2004 to form BGC Partners (now BGC Group,
  NASDAQ: BGC), which in turn acquired Newmark in 2011 and spun it out as Newmark
  Group (NASDAQ: NMRK) in 2017. Long-time chairman/CEO Howard Lutnick became the
  41st U.S. Secretary of Commerce on February 18, 2025; his sons Brandon and Kyle
  Lutnick assumed chairman and executive vice chairman roles, with Pascal Bandelier,
  Sage Kelly, and Christian Wall serving as co-CEOs. Cantor has no public developer
  portal — all electronic-trading, market-data, and prime-brokerage connectivity
  is delivered B2B under institutional client agreements; the closest public data
  surface is Fenics Market Data, sold by BGC affiliate Fenics under negotiated entitlement.
