    description: >-
      Cantor Fitzgerald, L.P. is a privately held global financial services firm founded
      in 1945. It is a U.S. Federal Reserve primary dealer in U.S. government securities
      and operates investment banking, fixed-income and equities trading, prime brokerage,
      research, and asset-management businesses across more than 60 offices in 20+ countries.
      Long-time chairman and CEO Howard Lutnick was confirmed as the 41st U.S. Secretary
      of Commerce on February 18, 2025; his sons Brandon (chairman) and Kyle (executive
      vice chairman) now lead the firm together with co-CEOs Pascal Bandelier, Sage
      Kelly, and Christian Wall. The firm has no public developer API or developer portal;
      access to electronic-trading and data feeds is gated behind institutional client
      onboarding.
